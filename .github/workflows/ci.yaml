name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  RUSTFLAGS: "-Dwarnings" # Make sure CI fails on all warnings

jobs:
  CI:
    name: CI
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use cache
        uses: Swatinem/rust-cache@v2

      - name: Run clippy (no features)
        run: cargo clippy --all-targets

      - name: Run clippy (mcp2515)
        run: cargo clippy --all-targets --no-default-features --features mcp2515

      - name: Run clippy (mcp25625)
        run: cargo clippy --all-targets --no-default-features --features mcp25625

      - name: Run clippy (all features)
        run: cargo clippy --all-targets --all-features

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests (no features)
        run: cargo test

      - name: Run tests (mcp2515)
        run: cargo test --no-default-features --features mcp2515

      - name: Run tests (mcp25625)
        run: cargo test --no-default-features --features mcp25625

      - name: Run tests (all features)
        run: cargo test --all-features
